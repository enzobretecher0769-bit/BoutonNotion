<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Accès rapide - Histoire</title>
<style>
  body {
    margin: 0;
    background: transparent;
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
  }

  /* Conteneur principal avec coins arrondis */
  .container {
    background-color: #482E1D;
    border-radius: 20px; /* 👈 Coins arrondis */
    padding: 20px;
    width: 350px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  }

  h2 {
    font-size: 22px;
    margin-top: 0;
    margin-bottom: 15px;
    color: #895D2B;
    text-align: center;
  }

  .link {
    display: block;
    padding: 8px 10px;
    margin: 5px 0;
    background-color: rgba(255,255,255,0.1);
    border-radius: 10px;
    color: white;
    text-decoration: none;
    transition: background 0.3s;
  }

  .link:hover {
    background-color: #6D3914;
  }
</style>
</head>
<body>
  <div class="container">
    <h2>📚 Accès rapide</h2>
    <a href="https://www.notion.so/France-xxxxxx" class="link" target="_blank">🇫🇷 France</a>
    <a href="https://www.notion.so/Italie-yyyyyy" class="link" target="_blank">🇮🇹 Italie</a>
    <a href="https://www.notion.so/Japon-zzzzzz" class="link" target="_blank">🇯🇵 Japon</a>
  </div>
</body>
</html>
