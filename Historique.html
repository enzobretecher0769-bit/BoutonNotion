<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historique</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    background: transparent; /* fond transparent pour Notion */
  }

  .historique {
    background-color: #3C2416; /* couleur bloc */
    border-radius: 20px;       /* coins arrondis */
    padding: 15px;
    color: #D7BDA6;            /* couleur texte */
    max-width: 300px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }

  h2 {
    margin: 0 0 10px 0;
    font-size: 16px;
    text-align: center;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    background-color: #5A3723;
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 8px;
    font-size: 14px;
  }

  li span {
    display: block;
    font-size: 12px;
    opacity: 0.8;
  }
</style>
</head>
<body>
  <div class="historique">
    <h2>🕓 Historique</h2>
    <ul id="historique-list">
      <li>Chargement...</li>
    </ul>
  </div>

  <script>
    async function chargerHistorique() {
      const res = await fetch('/api/notion');
      const data = await res.json();
      const ul = document.getElementById('historique-list');
      ul.innerHTML = '';
      data.forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `${item.nom}<span>Modifié le ${item.date}</span>`;
        ul.appendChild(li);
      });
    }

    chargerHistorique();
  </script>
</body>
</html>
