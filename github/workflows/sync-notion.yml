name: 🔄 Sync Notion to Supabase

on:
  schedule:
    - cron: "0 * * * *"  # ⏰ toutes les heures (au début de chaque heure)
  workflow_dispatch:      # te permet de le lancer manuellement depuis GitHub

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Récupération du code
        uses: actions/checkout@v3

      - name: 🟢 Installation de Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: 📦 Installation des dépendances
        run: npm install

      - name: 🚀 Exécution du script de synchronisation
        run: node syncNotionToSupabase.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
