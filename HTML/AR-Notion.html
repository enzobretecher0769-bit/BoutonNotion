<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accès rapide</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    background: transparent; /* pour s’intégrer dans Notion */
  }

  .acces-rapide {
    background-color: #482E1D; /* fond marron */
    border-radius: 20px;
    padding: 15px;
    color: #D7BDA6;
    max-width: 350px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }

  h2 {
    margin: 0 0 10px 0;
    font-size: 18px;
    text-align: center;
    color: #D7BDA6;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    background-color: #894c30; /* même style que historique */
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 8px;
    font-size: 14px;
    word-wrap: break-word;
    transition: all 0.2s;
  }

  li:hover {
    background-color: #743014;
  }

  .page-btn {
    display: block;
    width: 100%;
    text-align: left;
    color: #D7BDA6;
    background: none;
    border: none;
    font-size: 15px;
    cursor: pointer;
    padding: 0;
  }
</style>
</head>
<body>
  <div class="acces-rapide">
    <h2>📚 Accès rapide</h2>
    <ul id="acces-list">
      <li>Chargement...</li>
    </ul>
  </div>

  <script>
    async function chargerAccesRapide() {
      try {
        const res = await fetch('https://bouton-notion.vercel.app/api/Notion-AR.js');
        const pages = await res.json();

        const ul = document.getElementById("acces-list");
        ul.innerHTML = "";

        if (pages.length === 0) {
          ul.innerHTML = "<li>Aucune page trouvée</li>";
          return;
        }

        pages.forEach(page => {
          const li = document.createElement("li");

          const btn = document.createElement("button");
          btn.className = "page-btn";
          btn.onclick = () => window.open(page.url, "_blank");
          btn.textContent = page.titre;

          li.appendChild(btn);
          ul.appendChild(li);
        });

      } catch (err) {
        console.error(err);
        document.getElementById("acces-list").innerHTML =
          "<li>Erreur de chargement</li>";
      }
    }

    chargerAccesRapide();
  </script>
</body>
</html>
