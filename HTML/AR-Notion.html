<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accès rapide</title>
<style>
  body {
    margin: 0;
    background: transparent;
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
  }

  /* Conteneur principal avec coins arrondis */
  .container {
    background-color: #482E1D;
    border-radius: 20px; /* Coins arrondis */
    padding: 20px;
    width: 350px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  }

  h2 {
    font-size: 22px;
    margin-top: 0;
    margin-bottom: 15px;
    color: #D7BDA6;
    text-align: center;
  }

  .link {
    display: block;
    padding: 8px 10px;
    margin: 5px 0;
    background-color: rgba(255,255,255,0.1);
    border-radius: 10px;
    color: white;
    text-decoration: none;
    transition: background 0.3s;
  }

  .link:hover {
    background-color: #6D3914;
  }
</style>
</head>
<body>
  <div class="acces-rapide">
    <h2>📚 Accès rapide</h2>
    <ul id="acces-list">
      <li>Chargement...</li>
    </ul>
  </div>

  <script>
    async function chargerAccesRapide() {
      try {
        const res = await fetch('https://bouton-notion.vercel.app/api/Notion-AR.js');
        const pages = await res.json();

        const ul = document.getElementById("acces-list");
        ul.innerHTML = "";

        if (pages.length === 0) {
          ul.innerHTML = "<li>Aucune page trouvée</li>";
          return;
        }

        pages.forEach(page => {
          const li = document.createElement("li");

          const btn = document.createElement("button")
          btn.className = "page-btn";
          btn.onclick = () => window.open(page.url, "_blank");
          btn.innerHTML = `<strong>${page.titre}</strong>`;

          li.appendChild(btn);
          ul.appendChild(li);
        });

      } catch (err) {
        console.error(err);
        document.getElementById("acces-list").innerHTML = "<li>Erreur de chargement</li>";
      }
    }

    chargerAccesRapide();
  </script>
</body>
</html>
