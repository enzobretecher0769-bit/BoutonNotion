<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accès rapide</title>
<style>
  .acces-rapide {
    border-radius: 20px;
    padding: 20px; /* un peu plus d'espace */
    color: #D7BDA6;
    max-width: 400px; /* plus large */
    background-color: rgba(72, 46, 29, 0.6); /* fond semi-transparent */
    box-shadow: 0 4px 10px rgba(0,0,0,0.2); /* légère ombre */
  }

  h2 {
    margin: 0 0 15px 0;
    font-size: 18px; /* titre un peu plus grand */
    text-align: center;
  }

  .page-btn {
    display: block;
    width: 100%;
    text-align: left;
    background-color: rgba(72, 46, 29, 0.4); /* fond du bouton un peu plus visible */
    color: #D7BDA6;
    border: none;
    border-radius: 10px;
    padding: 12px; /* boutons plus grands */
    cursor: pointer;
    font-size: 15px; /* texte plus gros */
    word-wrap: break-word;
    transition: all 0.2s;
  }

  .page-btn:hover {
    background-color: #743014;
    color: #D7BDA6;
  }

  .page-btn strong {
    display: block;
    font-size: 17px; /* titre du bouton plus grand */
    margin-bottom: 4px;
  }
</style>
</head>
<body>
  <div class="acces-rapide">
    <h2>📚 Accès rapide</h2>
    <ul id="acces-list">
      <li>Chargement...</li>
    </ul>
  </div>

  <script>
    async function chargerAccesRapide() {
      try {
        const res = await fetch('https://bouton-notion.vercel.app/api/Notion-AR.js');
        const pages = await res.json();

        const ul = document.getElementById("acces-list");
        ul.innerHTML = "";

        if (pages.length === 0) {
          ul.innerHTML = "<li>Aucune page trouvée</li>";
          return;
        }

        pages.forEach(page => {
          const li = document.createElement("li");

          const btn = document.createElement("button");
          btn.className = "page-btn";
          btn.onclick = () => window.open(page.url, "_blank");
          btn.innerHTML = `<strong>${page.titre}</strong>`;

          li.appendChild(btn);
          ul.appendChild(li);
        });

      } catch (err) {
        console.error(err);
        document.getElementById("acces-list").innerHTML = "<li>Erreur de chargement</li>";
      }
    }

    chargerAccesRapide();
  </script>
</body>
</html>
