<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accès rapide</title>
<style>
  body {
    margin: 0;
    background: transparent;
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
  }

  .container {
    background-color: #482E1D;
    border-radius: 20px;
    padding: 20px;
    width: 350px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  }

  h2 {
    font-size: 22px;
    margin-top: 0;
    margin-bottom: 15px;
    color: #D7BDA6;
    text-align: center;
  }

  .link {
    display: block;
    padding: 12px 10px;
    margin: 8px 0;
    background-color: rgba(72, 46, 29, 0.3);
    border-radius: 10px;
    color: #D7BDA6;
    text-decoration: none;
    font-size: 16px;
    transition: background 0.3s;
  }

  .link:hover {
    background-color: #743014;
  }
</style>
</head>
<body>
  <div class="container">
    <h2>📚 Accès rapide</h2>
    <div id="acces-list">
      Chargement...
    </div>
  </div>

  <script>
    async function chargerAccesRapide() {
      try {
        const res = await fetch('https://bouton-notion.vercel.app/api/Notion-AR.js');
        const pages = await res.json();

        const container = document.getElementById("acces-list");
        container.innerHTML = "";

        if (pages.length === 0) {
          container.innerHTML = "<p>Aucune page trouvée</p>";
          return;
        }

        pages.forEach(page => {
          const a = document.createElement("a");
          a.className = "link";
          a.href = page.url;
          a.target = "_blank";
          a.textContent = page.titre;

          container.appendChild(a);
        });

      } catch (err) {
        console.error(err);
        document.getElementById("acces-list").innerHTML = "<p>Erreur de chargement</p>";
      }
    }

    chargerAccesRapide();
  </script>
</body>
</html>
