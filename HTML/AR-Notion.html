<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accès rapide</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    background: transparent;
  }

  .acces-rapide {
    background-color: #482E1D;
    border-radius: 20px;
    padding: 15px;
    color: #D7BDA6;
    max-width: 350px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }

  h2 {
    margin: 0 0 10px 0;
    font-size: 18px;
    text-align: center;
    color: #D7BDA6;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    background-color: #6D3914;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 8px;
    font-size: 14px;
    word-wrap: break-word;
    transition: all 0.2s;
  }

  li:hover {
    background-color: #743014;
  }

  .page-btn {
    display: block;
    width: 100%;
    text-align: left;
    color: #D7BDA6;
    background: none;
    border: none;
    font-size: 15px;
    cursor: pointer;
    padding: 0;
  }
</style>
</head>
<body>
  <div class="acces-rapide">
    <h2>📚 Accès rapide</h2>
    <ul id="acces-list">
      <li>Chargement...</li>
    </ul>
  </div>

  <script>
    // --- Stockage local des pages visitées ---
    function enregistrerVisite(pageId, titre, url) {
      const historique = JSON.parse(localStorage.getItem("accesRapide") || "[]");
      const existante = historique.find(p => p.pageId === pageId);

      if (existante) {
        existante.date = Date.now(); // mise à jour du timestamp
      } else {
        historique.push({ pageId, titre, url, date: Date.now() });
      }

      localStorage.setItem("accesRapide", JSON.stringify(historique));
    }

    // --- Chargement de la liste depuis ton API ---
    async function chargerAccesRapide() {
      try {
        const res = await fetch('https://bouton-notion.vercel.app/api/Notion-AR.js');
        const pages = await res.json();

        // récupérer les visites stockées
        const historique = JSON.parse(localStorage.getItem("accesRapide") || "[]");

        // trier : pages les plus récemment ouvertes d'abord
        const tri = pages.sort((a, b) => {
          const dateA = historique.find(p => p.pageId === a.pageId)?.date || 0;
          const dateB = historique.find(p => p.pageId === b.pageId)?.date || 0;
          return dateB - dateA;
        });

        const ul = document.getElementById("acces-list");
        ul.innerHTML = "";

        if (tri.length === 0) {
          ul.innerHTML = "<li>Aucune page trouvée</li>";
          return;
        }

        tri.forEach(page => {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.className = "page-btn";
          btn.textContent = page.titre;

          btn.onclick = () => {
            enregistrerVisite(page.pageId, page.titre, page.url);
            window.open(page.url, "_blank");
          };

          li.appendChild(btn);
          ul.appendChild(li);
        });

      } catch (err) {
        console.error(err);
        document.getElementById("acces-list").innerHTML = "<li>Erreur de chargement</li>";
      }
    }

    chargerAccesRapide();
  </script>
</body>
</html>
