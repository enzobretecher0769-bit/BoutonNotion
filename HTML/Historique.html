<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historique</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap');

  body {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    background: transparent;
  }

  .historique {
    border-radius: 20px;
    padding: 15px;
    color: #D7BDA6;
    max-width: 350px;
  }

  h2 {
    margin: 0 0 10px 0;
    font-size: 16px;
    text-align: center;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    margin-bottom: 10px;
  }

  .page-btn {
    display: block;
    width: 100%;
    height: 50px;
    text-align: left;
    background-color: rgba(72, 46, 29, 0.3);
    color: #D7BDA6;
    border: none;
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }

  .page-btn:hover {
    background-color: #743014;
    color: #D7BDA6;
  }

  .page-btn strong {
    display: block;
    font-size: 16px;
    margin-bottom: 4px;
  }

  .page-btn span {
    display: block;
    font-size: 12px;
    opacity: 0.8;
    margin-bottom: 6px;
  }

  .page-btn .contenu-preview {
    font-size: 13px;
    opacity: 0.9;
    white-space: pre-wrap;
    max-height: 80px;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div class="historique">
    <h2>🕓 Historique des pages</h2>
    <ul id="historique-list">
      <li>Chargement...</li>
    </ul>
  </div>

  <script>
    async function chargerHistorique() {
      const ul = document.getElementById("historique-list");
      ul.innerHTML = "<li>Chargement...</li>";

      try {
        const res = await fetch('https://bouton-notion.vercel.app/api/Notion');
        const pages = await res.json();

        if (!pages || pages.length === 0) {
          ul.innerHTML = "<li>Aucune donnée trouvée</li>";
          return;
        }

        ul.innerHTML = "";
        pages.forEach(page => {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.className = "page-btn";
          btn.onclick = () => window.open(page.url, "_blank");

          btn.innerHTML = `
            <strong>${page.titre}</strong>
            <span>Dernière modification : ${page.date}</span>
            <div class="contenu-preview">${page.contenu || ''}</div>
          `;

          li.appendChild(btn);
          ul.appendChild(li);
        });

      } catch (err) {
        console.error("Erreur Historique:", err);
        ul.innerHTML = "<li>Erreur de chargement des données</li>";
      }
    }

    // 🔄 Chargement initial
    chargerHistorique();

    // 🕒 Vérifie toutes les 10 secondes si un refresh est demandé
    setInterval(async () => {
      try {
        const res = await fetch('https://bouton-notion.vercel.app/api/refresh');
        const data = await res.json();
        if (data.refresh) {
          console.log("🔄 Rafraîchissement demandé !");
          chargerHistorique(); // recharge seulement le contenu, sans reload la page
        }
      } catch (err) {
        console.warn("Erreur refresh:", err);
      }
    }, 10000);
  </script>
</body>
</html>
