<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historique</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    background: transparent; /* Fond transparent pour s’intégrer dans Notion */
  }

  .historique {
    border-radius: 20px;
    padding: 15px;
    color: #D7BDA6; /* Couleur du texte assortie */
    max-width: 350px;
  }

  h2 {
    margin: 0 0 10px 0;
    font-size: 16px;
    text-align: center;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    background-color: rgba(72, 46, 29, 0.3); /* Fond doux et semi-transparent */
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 8px;
    font-size: 14px;
    word-wrap: break-word;
  }

  li span {
    display: block;
    font-size: 12px;
    opacity: 0.8;
  }

  a {
    color: #D7BDA6;
    text-decoration: none;
    font-weight: bold;
  }

  a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="historique">
    <h2>🕓 Historique des pages</h2>
    <ul id="historique-list">
      <li>Chargement...</li>
    </ul>
  </div>

  <script>
    async function chargerHistorique() {
      try {
        const res = await fetch('https://bouton-notion.vercel.app/api/Notion'); // Ton lien Vercel
        const pages = await res.json();

        // Trier par date (du plus récent au plus ancien)
        pages.sort((a, b) => new Date(b.date) - new Date(a.date));

        // Ne garder que les 5 plus récentes
        const recent = pages.slice(0, 5);

        const ul = document.getElementById("historique-list");
        ul.innerHTML = "";

        recent.forEach(page => {
          const li = document.createElement("li");
          li.innerHTML = `
            <a href="${page.url}" target="_blank">${page.titre}</a>
            <span>Dernière modification : ${page.date}</span>
            <span>${page.contenu}</span>
          `;
          ul.appendChild(li);
        });
      } catch (err) {
        console.error(err);
        document.getElementById("historique-list").innerHTML = "<li>Erreur de chargement</li>";
      }
    }

    chargerHistorique();
  </script>
</body>
</html>
