<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historique des pages Notion</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    ul {
      list-style: none;
      padding: 0;
      max-width: 600px;
      margin: 20px auto;
    }
    li {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    li:hover {
      transform: scale(1.02);
    }
    a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
    .date {
      display: block;
      color: #666;
      font-size: 0.9em;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>🕓 Dernières pages Notion modifiées</h1>
  <ul id="notionList"></ul>

  <script>
    async function chargerPages() {
      const res = await fetch("/api/Notion");
      const pages = await res.json();

      const list = document.getElementById("notionList");
      list.innerHTML = "";

      pages.forEach(page => {
        const li = document.createElement("li");
        li.innerHTML = `
          <a href="${page.url}" target="_blank">${page.titre}</a>
          <span class="date">Dernière modification : ${page.date}</span>
        `;
        list.appendChild(li);
      });
    }

    chargerPages();
  </script>
</body>
</html>
