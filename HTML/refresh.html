<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouton Rafraîchir</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap');

  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 120px;
    margin: 0;
    font-family: 'Poppins', sans-serif;
  }

  .btn-refresh {
    background-color: #E8D1A7; /* Couleur plus claire */
    color: #482E1D;
    padding: 14px 28px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: all 0.2s ease;
  }

  .btn-refresh:hover {
    background-color: #743014;
    color: #E8D1A7;
    transform: scale(1.05);
  }

  .success {
    background-color: #4CAF50;
    color: white;
  }

  .error {
    background-color: #D9534F;
    color: white;
  }
</style>
</head>
<body>
  <button class="btn-refresh" id="refreshBtn">🔄 Rafraîchir</button>

  <script>
    const btn = document.getElementById('refreshBtn');

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = '⏳ Envoi...';

      try {
        // 🔗 Mets ici ton vrai lien Vercel :
        const res = await fetch('https://bouton-notion.vercel.app/api/refresh', {
          method: 'POST',
        });

        if (res.ok) {
          btn.textContent = '✅ Rafraîchissement demandé !';
          btn.classList.add('success');
        } else {
          btn.textContent = '❌ Erreur';
          btn.classList.add('error');
        }
      } catch (err) {
        console.error(err);
        btn.textContent = '⚠️ Erreur réseau';
        btn.classList.add('error');
      }

      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = '🔄 Rafraîchir';
        btn.classList.remove('success', 'error');
      }, 2000);
    });
  </script>
</body>
</html>
