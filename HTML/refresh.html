<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rafraîchir</title>
<style>
  body {
    margin: 0;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
  }

  .refresh-btn {
    background-color: #E8D1A7;
    color: #482E1D;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
  }

  .refresh-btn:hover {
    background-color: #D7BDA6;
    transform: scale(1.05);
  }
</style>
</head>
<body>
  <button class="refresh-btn" onclick="rafraichir()">🔄 Rafraîchir</button>

  <script>
    function rafraichir() {
      // Envoie un message à la page parente (historique)
      if (window.parent) {
        window.parent.postMessage("refresh-historique", "*");
      }
    }
  </script>
</body>
</html>
