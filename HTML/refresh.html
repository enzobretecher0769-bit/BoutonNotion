<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rafraîchir</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap');

  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    margin: 0;
  }

  .btn-refresh {
    background-color: #E8D1A7; /* fond clair */
    color: #743014;            /* texte brun */
    padding: 15px 30px;
    border: none;
    border-radius: 12px;
    font-size: 20px;
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.2s, background 0.2s, color 0.2s;
  }

  .btn-refresh:hover {
    background-color: #743014; /* fond inversé */
    color: #E8D1A7;            /* texte clair */
    transform: scale(1.05);
  }
</style>
</head>
<body>
  <button onclick="fetch('https://bouton-notion.vercel.app/api/refresh', {method: 'POST'})">
  Rafraîchir
</button>


  <script>
    function rafraichir() {
      // Envoie un message à la page parente (historique.html)
      if (window.parent) {
        window.parent.postMessage("refresh-historique", "*");
      }
    }
  </script>
</body>
</html>
