<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Créer une page</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap');

  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 120px;
    margin: 0;
    position: relative;
  }

  .btn {
    background-color: #482E1D;
    color: #E8D1A7;
    padding: 15px 30px;
    border: none;
    border-radius: 12px;
    font-size: 20px;
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.2s, background 0.2s, color 0.2s;
  }

  .btn:hover {
    background-color: #E8D1A7;
    color: #743014;
    transform: scale(1.05);
  }

  /* --- Modale --- */
  .modal {
    display: none;
    position: absolute;
    z-index: 10;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .modal-content {
    background-color: #482E1D;
    padding: 20px;
    border-radius: 20px;
    width: 90%;
    max-width: 320px;
    color: #E8D1A7;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }

  .modal-content input {
    width: 80%;
    padding: 10px;
    border: none;
    border-radius: 10px;
    margin-bottom: 10px;
    text-align: center;
    font-family: 'Poppins', sans-serif;
  }

  .close {
    color: #E8D1A7;
    float: right;
    font-size: 22px;
    cursor: pointer;
  }

  .close:hover {
    color: white;
  }

  #createBtn {
    background-color: #743014;
    color: #E8D1A7;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 15px;
    transition: background 0.2s;
  }

  #createBtn:hover {
    background-color: #E8D1A7;
    color: #743014;
  }
</style>
</head>
<body>

  <button class="btn" id="openModal">🪶 Créer une page</button>

  <div id="pageModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>Nouvelle page</h3>
      <input type="text" id="pageName" placeholder="Nom de la page">
      <input type="text" id="pageEmoji" placeholder="Emoji (ex: 📖)">
      <br>
      <button id="createBtn">Créer</button>
    </div>
  </div>

  <script>
    const modal = document.getElementById("pageModal");
    const openModal = document.getElementById("openModal");
    const closeModal = document.querySelector(".close");
    const createBtn = document.getElementById("createBtn");

    openModal.onclick = () => {
      modal.style.display = "block";
      openModal.style.display = "none"; // bouton disparaît
    };

    closeModal.onclick = () => {
      modal.style.display = "none";
      openModal.style.display = "inline-block"; // bouton réapparaît
    };

    createBtn.onclick = async () => {
      const name = document.getElementById("pageName").value.trim();
      const emoji = document.getElementById("pageEmoji").value.trim() || "📄";

      if (!name) {
        alert("Merci d’indiquer un nom de page !");
        return;
      }

      try {
        const res = await fetch("https://bouton-notion.vercel.app/api/createPage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, emoji })
        });

        const data = await res.json();
        if (res.ok) {
          alert("✅ Page créée avec succès !");
          modal.style.display = "none";
          openModal.style.display = "inline-block";
          document.getElementById("pageName").value = "";
          document.getElementById("pageEmoji").value = "";
        } else {
          alert("❌ Erreur : " + data.error);
        }
      } catch (err) {
        alert("⚠️ Impossible de créer la page : " + err.message);
      }
    };
  </script>

</body>
</html>
